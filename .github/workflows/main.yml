name: Build RS Institute Staff Portal APK

on:
  workflow_dispatch:
  push:
    branches: ["main"]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Extract Android source ZIP
        shell: bash
        run: |
          set -euo pipefail
          SOURCE_ZIP="$(find . -maxdepth 1 -type f \( \
            -iname 'RS-INSTITUTE-Staff-Portal-Android-Source*.zip' -o \
            -iname 'RSInstitutePortal_Android_Source*.zip' \
          \) -print -quit)"
          if [ -z "$SOURCE_ZIP" ]; then
            echo "Android source ZIP not found in repository root."
            exit 1
          fi
          mkdir -p extracted_project
          unzip -q "$SOURCE_ZIP" -d extracted_project
          test -f extracted_project/settings.gradle

      - name: Build debug APK
        run: |
          cd extracted_project
          gradle assembleDebug

      - name: Rename APK
        run: |
          cp extracted_project/app/build/outputs/apk/debug/app-debug.apk \
             extracted_project/app/build/outputs/apk/debug/RS-INSTITUTE-Staff-Portal.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: RS-INSTITUTE-Staff-Portal
          path: extracted_project/app/build/outputs/apk/debug/RS-INSTITUTE-Staff-Portal.apk
          if-no-files-found: error
